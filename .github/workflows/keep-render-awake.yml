name: Keep Render service awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::error::Set the repository variable RENDER_URL to your Render service URL."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 "${RENDER_URL%/}/health"
